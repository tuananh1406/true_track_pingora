[package]
name = "true_track_pingora"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
pingora = { version = "0.8.0", features = ["lb", "openssl"] }
pingora-error = "0.8.0"
log = "0.4"
env_logger = "0.11.8"
toml = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
http = "1.3.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "chrono",
] }
tracing-appender = "0.2.3"
bytes = "1.10.1"

openssl = "0.10"
rustls-pemfile = "2.1.2"
x509-parser = "0.18.0"
regex = "1.12.2"
derive_more = { version = "2.1.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
